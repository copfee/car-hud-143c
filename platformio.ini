[platformio]
default_envs = waveshare_amoled_143c

[env:waveshare_amoled_143c]
platform = espressif32@6.9.0
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = partitions/partition_8M.csv
monitor_speed = 115200
upload_speed = 460800
extra_scripts = pre:tools/reproducible_paths.py
build_src_filter = -<*> +<hud/>
lib_deps =
    lvgl/lvgl@9.4.0
    moononournation/GFX Library for Arduino@1.5.7
    lewisxhe/SensorLib@0.3.1
    h2zero/NimBLE-Arduino@2.2.3
build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D ESP32QSPI_MAX_PIXELS_AT_ONCE=4096
    -I src/hud
    -std=gnu++17
build_unflags = -std=gnu++11
